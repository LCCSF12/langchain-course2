[project]
name = "langgaph-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Seu Nome", email = "seu@email.com" }
]
requires-python = ">=3.10"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.10",
    "langchain-core>=1.7.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
langgaph-course = "langgaph_course:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
